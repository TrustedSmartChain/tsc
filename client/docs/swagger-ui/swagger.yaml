                  owner:
                    type: string
                    description: >-
                      owner is the address that controls grants within this
                      namespace.
                description: >-
                  Namespace is the per-module grant domain. Each consuming
                  module owns exactly

                  one namespace, keyed by its module name; the namespace owner
                  is the address

                  allowed to grant and revoke permissions within it.
              permissions:
                type: array
                items:
                  type: string
                description: >-
                  permissions is the valid permission vocabulary the module
                  registered in

                  this binary, in ascending order.
            description: >-
              QueryModuleResponse is the response type for the Query/Module RPC
              method.
