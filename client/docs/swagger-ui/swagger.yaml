              rwa_daily_limit is the maximum number of MsgAttestRwa per node per
              UTC

              day.
          rwu_daily_limit:
            type: string
            format: uint64
            description: >-
              rwu_daily_limit is the maximum number of MsgAttestRwu per node per
              UTC

              day.
