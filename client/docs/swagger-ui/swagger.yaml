          max_gasless_msgs:
            type: string
            format: uint64
            description: >-
              max_gasless_msgs caps the number of messages in a gasless
              transaction.
          max_gasless_tx_bytes:
            type: string
            format: uint64
            description: >-
              max_gasless_tx_bytes caps the encoded size of a gasless
              transaction.
    description: MsgUpdateParams is the Msg/UpdateParams request type.
  network.v1.MsgUpdateParamsResponse:
    type: object
    description: MsgUpdateParamsResponse is the Msg/UpdateParams response type.
  network.v1.NodeStatusPayload:
    type: object
    properties:
      device:
        type: string
        description: device describes the device/hardware.
      os:
        type: string
        description: os describes the operating system and version.
      hostname:
        type: string
        description: hostname is the node's self-reported hostname.
      node_info:
        type: string
        description: node_info describes the node software and version.
      workloads:
        type: array
        items:
          type: string
        description: workloads lists the workloads the node is running.
      memory:
        type: string
        description: memory describes memory capacity/usage.
      cpu:
        type: string
        description: cpu describes CPU capacity/usage.
      storage:
        type: string
        description: storage describes storage capacity/usage.
    description: |-
      NodeStatusPayload carries a node's self-reported status fields. The chain
      treats every field as opaque: what a node populates is node-software
      policy, and the payload is emitted as a node_status event rather than
      stored in state.
