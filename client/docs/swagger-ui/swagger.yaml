        format: date-time
        description: |-
          created_at is the block time the key was authorized, used for the
          recent-creation window check.
      status:
        description: status is the key lifecycle state.
        type: string
        enum:
          - ACTIVATION_KEY_STATUS_UNSPECIFIED
          - ACTIVATION_KEY_STATUS_ACTIVE
          - ACTIVATION_KEY_STATUS_DISABLED
        default: ACTIVATION_KEY_STATUS_UNSPECIFIED
    description: >-
      ActivationKey is an activation key record. The address is permanently
      bound

      to the first operator that authorizes it, even after deauthorization.
  network.v1.ActivationKeyStatus:
    type: string
    enum:
      - ACTIVATION_KEY_STATUS_UNSPECIFIED
      - ACTIVATION_KEY_STATUS_ACTIVE
      - ACTIVATION_KEY_STATUS_DISABLED
    default: ACTIVATION_KEY_STATUS_UNSPECIFIED
    description: |-
      ActivationKeyStatus enumerates the lifecycle states of an activation key.

       - ACTIVATION_KEY_STATUS_UNSPECIFIED: ACTIVATION_KEY_STATUS_UNSPECIFIED is the zero value and never valid in state.
       - ACTIVATION_KEY_STATUS_ACTIVE: ACTIVATION_KEY_STATUS_ACTIVE marks a key that may activate nodes.
       - ACTIVATION_KEY_STATUS_DISABLED: ACTIVATION_KEY_STATUS_DISABLED marks a deauthorized key. The record is
      retained: the address is permanently bound to its operator and can never
      be re-authorized, and it still counts toward the recent-creation window.
