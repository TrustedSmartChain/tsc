                        NOTE: The amount field is an Int which implements the
                        custom method

                        signatures required by gogoproto.
              pagination:
                type: object
                properties:
                  next_key:
                    type: string
                    format: byte
                    description: |-
                      next_key is the key to be passed to PageRequest.key to
                      query the next page most efficiently. It will be empty if
                      there are no more results.
                  total:
                    type: string
                    format: uint64
                    title: >-
                      total is total number of results available if
                      PageRequest.count_total

                      was set, its value is undefined otherwise
                description: >-
                  PageResponse is to be embedded in gRPC response messages where
                  the

                  corresponding request message has used PageRequest.

                   message SomeResponse {
                           repeated Bar results = 1;
                           PageResponse page = 2;
                   }
            description: >-
              QueryActiveLocksResponse is response type for the
              Query/ActiveLocks RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: pagination.key
          description: |-
            key is a value returned in PageResponse.next_key to begin
            querying the next page most efficiently. Only one of offset or key
            should be set.
          in: query
          required: false
          type: string
          format: byte
        - name: pagination.offset
          description: >-
            offset is a numeric offset that can be used when key is unavailable.

            It is less efficient than using key. Only one of offset or key
            should

            be set.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.limit
          description: >-
            limit is the total number of results to be returned in the result
            page.

            If left empty it will default to a value to be set by each app.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.count_total
          description: >-
            count_total is set to true  to indicate that the result set should
            include

            a count of the total number of items available for pagination in
            UIs.

            count_total is only respected when offset is used. It is ignored
            when key

            is set.
          in: query
          required: false
          type: boolean
        - name: pagination.reverse
          description: >-
            reverse is set to true if results are to be returned in the
            descending order.
          in: query
          required: false
          type: boolean
      tags:
        - Query
  /tsc/lockup/total_locked_amount:
    get:
      summary: >-
        TotalLockedAmount queries the total amount of tokens locked across all
        accounts.
      operationId: TotalLockedAmount
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              total_locked:
                type: object
                properties:
                  denom:
                    type: string
                  amount:
                    type: string
                description: >-
                  Coin defines a token with a denomination and an amount.


                  NOTE: The amount field is an Int which implements the custom
                  method

                  signatures required by gogoproto.
            description: >-
              QueryTotalLockedAmountResponse is response type for the
              Query/TotalLockedAmount RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /tsc/lockup/v1/tx/extend:
    post:
      summary: Extend extends the lock duration for a specific address.
      operationId: Extend
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Msg
  /tsc/lockup/v1/tx/lock:
    post:
      summary: Lock locks tokens for a specific address.
      operationId: Lock
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Msg
  /tsc/lockup/v1/tx/multi_send_delegate_and_lock:
    post:
      summary: >-
        MultiSendDelegateAndLock sends tokens to multiple addresses, delegates
        them to a validator, and locks them until specified unlock dates.
      operationId: MultiSendDelegateAndLock
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Msg
  /tsc/lockup/v1/tx/send_delegate_and_lock:
    post:
      summary: >-
        SendDelegateAndLock sends tokens to a specific address, delegates them
        to a validator, and locks them until a specified unlock date.
      operationId: SendDelegateAndLock
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Msg
  /nodelabs/license/license/{id}:
    get:
      summary: >-
        License queries a license by id. Ids are unique chain-wide, so no
        license

        type is needed to resolve one.
      operationId: License
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              license:
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                    description: >-
                      id is the auto-incremented identifier, unique chain-wide
                      across all

                      license types. A bare id is a complete handle to a
                      license.
                  type:
                    type: string
                    description: type is the LicenseType.id this license was issued from.
                  holder:
                    type: string
                    description: holder is the address that owns this license.
                  start_date:
                    type: string
                    description: start_date is the date from which the license is valid.
                  end_date:
                    type: string
                    description: >-
                      end_date is the expiry date as issued. Empty string means
                      no expiry.

                      Revocation does not modify this field.
                  status:
                    description: status is the license lifecycle state.
                    type: string
                    enum:
                      - LICENSE_STATUS_UNSPECIFIED
                      - LICENSE_STATUS_ACTIVE
                      - LICENSE_STATUS_REVOKED
                    default: LICENSE_STATUS_UNSPECIFIED
                  revoked_date:
                    type: string
                    description: >-
                      revoked_date is the date the license was revoked (block
                      date).

                      Empty unless status is LICENSE_STATUS_REVOKED.
                description: License represents an issued license instance.
            description: >-
              QueryLicenseResponse is the response type for the Query/License
              RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: id
          description: id is the chain-wide unique license id.
          in: path
          required: true
          type: string
          format: uint64
      tags:
        - Query
  /nodelabs/license/license_type/{id}:
    get:
      summary: LicenseType queries a license type by id.
      operationId: LicenseType
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              license_type:
                type: object
                properties:
                  id:
                    type: string
                    description: id is the owner-supplied identifier, e.g. "nodelabs.node".
                  transferrable:
                    type: boolean
                    description: >-
                      transferrable indicates whether holders may transfer this
                      license type.
                  max_supply:
                    type: string
                    description: >-
                      max_supply is the maximum number of licenses outstanding
                      at once, checked

                      against active_count. Revoking frees a slot, so lifetime
                      issued_count may

                      exceed it. 0 = unlimited.
                  issued_count:
                    type: string
                    description: >-
                      issued_count tracks the total number of licenses issued
                      (used for ID generation).
                  active_count:
                    type: string
                    description: >-
                      active_count tracks the number of currently active
                      licenses.
                  revoked_count:
                    type: string
                    description: revoked_count tracks the number of revoked licenses.
                description: LicenseType defines a template for issuing licenses.
            description: >-
              QueryLicenseTypeResponse is the response type for the
              Query/LicenseType RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: id
          in: path
          required: true
          type: string
      tags:
        - Query
  /nodelabs/license/license_types:
    get:
      summary: LicenseTypes queries all license types.
      operationId: LicenseTypes
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              license_types:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: >-
                        id is the owner-supplied identifier, e.g.
                        "nodelabs.node".
                    transferrable:
                      type: boolean
                      description: >-
                        transferrable indicates whether holders may transfer
                        this license type.
                    max_supply:
                      type: string
                      description: >-
                        max_supply is the maximum number of licenses outstanding
                        at once, checked

                        against active_count. Revoking frees a slot, so lifetime
                        issued_count may

                        exceed it. 0 = unlimited.
                    issued_count:
                      type: string
                      description: >-
                        issued_count tracks the total number of licenses issued
                        (used for ID generation).
                    active_count:
                      type: string
                      description: >-
                        active_count tracks the number of currently active
                        licenses.
                    revoked_count:
                      type: string
                      description: revoked_count tracks the number of revoked licenses.
                  description: LicenseType defines a template for issuing licenses.
              pagination:
                type: object
                properties:
                  next_key:
                    type: string
                    format: byte
                    description: |-
                      next_key is the key to be passed to PageRequest.key to
                      query the next page most efficiently. It will be empty if
                      there are no more results.
                  total:
                    type: string
                    format: uint64
                    title: >-
                      total is total number of results available if
                      PageRequest.count_total

                      was set, its value is undefined otherwise
                description: >-
                  PageResponse is to be embedded in gRPC response messages where
                  the

                  corresponding request message has used PageRequest.

                   message SomeResponse {
                           repeated Bar results = 1;
                           PageResponse page = 2;
                   }
            description: >-
              QueryLicenseTypesResponse is the response type for the
              Query/LicenseTypes RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: pagination.key
          description: |-
            key is a value returned in PageResponse.next_key to begin
            querying the next page most efficiently. Only one of offset or key
            should be set.
          in: query
          required: false
          type: string
          format: byte
        - name: pagination.offset
          description: >-
            offset is a numeric offset that can be used when key is unavailable.

            It is less efficient than using key. Only one of offset or key
            should

            be set.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.limit
          description: >-
            limit is the total number of results to be returned in the result
            page.

            If left empty it will default to a value to be set by each app.
          in: query
          required: false
          type: string
          format: uint64
        - name: pagination.count_total
          description: >-
            count_total is set to true  to indicate that the result set should
            include

            a count of the total number of items available for pagination in
            UIs.

            count_total is only respected when offset is used. It is ignored
            when key

            is set.
          in: query
          required: false
          type: boolean
        - name: pagination.reverse
          description: >-
            reverse is set to true if results are to be returned in the
            descending order.
          in: query
          required: false
          type: boolean
      tags:
        - Query
  /nodelabs/license/licenses:
    get:
      summary: >-
        Licenses queries all licenses across all license types, active and
        revoked.
      operationId: Licenses
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              licenses:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uint64
                      description: >-
                        id is the auto-incremented identifier, unique chain-wide
                        across all

                        license types. A bare id is a complete handle to a
                        license.
                    type:
                      type: string
                      description: type is the LicenseType.id this license was issued from.
                    holder:
                      type: string
                      description: holder is the address that owns this license.
                    start_date:
                      type: string
                      description: start_date is the date from which the license is valid.
                    end_date:
                      type: string
                      description: >-
                        end_date is the expiry date as issued. Empty string
                        means no expiry.

                        Revocation does not modify this field.
                    status:
                      description: status is the license lifecycle state.
                      type: string
