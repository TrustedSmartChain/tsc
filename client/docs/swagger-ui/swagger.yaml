  /nodelabs/network/params:
    get:
      summary: Params queries the module parameters.
      operationId: NetworkParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: params are the current module parameters.
                type: object
                properties:
                  activation_limit_multiplier:
                    type: string
                    format: uint64
                    description: >-
                      activation_limit_multiplier scales a node type's active
                      license count into

                      that node type's activation limit.
                  spam_limit_multiplier:
                    type: string
                    format: uint64
                    description: >-
                      spam_limit_multiplier scales a node type's active license
                      count into the

                      recent-activity ceiling that hard-stops activation bursts.
                  max_activation_keys:
                    type: string
                    format: uint64
                    description: >-
                      max_activation_keys is the maximum number of active
                      activation keys per

                      operator.
                  recent_key_limit:
                    type: string
                    format: uint64
                    description: >-
                      recent_key_limit is the maximum number of activation keys
                      an operator may

                      create within recent_key_window.
                  recent_key_window:
                    type: string
                    description: >-
                      recent_key_window is the sliding window for
                      recent_key_limit.
                  status_daily_limit:
                    type: string
                    format: uint64
                    description: >-
                      status_daily_limit is the maximum number of
                      MsgUpdateNodeStatus per node

                      per UTC day.
                  deauthorize_fee:
                    type: array
                    items:
                      type: object
                      properties:
                        denom:
                          type: string
                        amount:
                          type: string
                      description: >-
                        Coin defines a token with a denomination and an amount.


                        NOTE: The amount field is an Int which implements the
                        custom method

                        signatures required by gogoproto.
                    description: >-
                      deauthorize_fee is charged by the
                      MsgDeauthorizeActivationKey handler as

                      a bank transfer to the fee collector, on top of regular
                      gas. Empty

                      disables the charge; chains that want it seed a
                      denominated value.
                  max_gasless_gas:
                    type: string
                    format: uint64
                    description: >-
                      max_gasless_gas caps the declared gas wanted of a gasless
                      transaction.
                  max_gasless_msgs:
                    type: string
                    format: uint64
                    description: >-
                      max_gasless_msgs caps the number of messages in a gasless
                      transaction.
                  max_gasless_tx_bytes:
                    type: string
                    format: uint64
                    description: >-
                      max_gasless_tx_bytes caps the encoded size of a gasless
                      transaction.
            description: >-
              QueryParamsResponse is the response type for the Query/Params RPC
              method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /nodelabs/network/tx/activate_node:
    post:
      summary: |-
        ActivateNode activates a node under an operator, signed by an authorized
        activation key. Gasless.
      operationId: ActivateNode
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            description: MsgActivateNodeResponse is the Msg/ActivateNode response type.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              activation_address:
                type: string
                description: >-
                  activation_address is the signing activation key. It must be
                  active and

                  bound to operator.
              operator:
                type: string
                description: operator is the wallet whose licenses back this activation.
              node_address:
                type: string
                description: >-
                  node_address is the node account address to activate. The node
                  does not

                  sign, so delayed activation works by construction.
              node_type:
                type: string
                description: >-
                  node_type is the node type recorded on the node. It must name
                  a

                  registered NodeType.
            description: MsgActivateNode is the Msg/ActivateNode request type.
