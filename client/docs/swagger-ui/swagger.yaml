          in: body
          required: true
          schema:
            type: object
            properties:
              signer:
                type: string
                description: >-
                  signer is the operator, the node's original still-active
                  activation key,

                  or the node itself.
              node_address:
                type: string
                description: >-
                  node_address is the node to deactivate. Deactivation is
