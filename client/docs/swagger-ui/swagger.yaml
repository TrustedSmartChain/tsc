swagger: '2.0'
info:
  title: TSC - gRPC Gateway docs
  description: A REST interface for state queries and transactions.
  version: 1.0.0
paths:
  /tsc/distro/v1/params:
    get:
      summary: Params queries all parameters of the module.
      operationId: DistroParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              params:
                description: params defines the parameters of the module.
                type: object
                properties:
                  minting_address:
                    type: string
                  receiving_address:
                    type: string
                  denom:
                    type: string
                  max_supply:
                    type: string
                  distribution_start_date:
                    type: string
                  months_in_halving_period:
                    type: string
                    format: uint64
            description: >-
              QueryParamsResponse is the response type for the Query/Params RPC
              method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      tags:
        - Query
  /tsc/distro/v1/tx/mint:
    post:
      operationId: Mint
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
