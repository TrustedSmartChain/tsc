        - Msg
  /nodelabs/network/tx/create_node_type:
    post:
      summary: >-
        CreateNodeType registers a node type bound to a license type. Signer
        must

        hold the "nodetype.create" grant in the network permission namespace,
        and

        the named license type must exist. Regular gas tx.
      operationId: CreateNodeType
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            description: MsgCreateNodeTypeResponse is the Msg/CreateNodeType response type.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              creator:
                type: string
                description: >-
                  creator is the signer. It must hold the module-wide
                  "nodetype.create"

                  grant.
              id:
                type: string
                description: >-
                  id is the node type identifier to register. Node type ids are
                  single-use:

                  records are never removed and cannot be re-registered.
              license_type_id:
                type: string
                description: >-
                  license_type_id is the license type this node type is bound
                  to. The

                  binding is fixed at creation.
            description: >-
              MsgCreateNodeType is the Msg/CreateNodeType request type.
              Registration is

              gated on the module-wide "nodetype.create" grant, which authorizes
              defining

              node types against any existing license type. The signing address
              is not

              recorded on the node type: the grant is the whole authorization,
              so keeping

              the address would preserve no authority.
