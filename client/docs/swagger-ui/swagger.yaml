      tags:
        - Msg
  /nodelabs/network/tx/update_params:
    post:
      summary: |-
        UpdateParams updates the module parameters. Signer must be the module
        authority.
      operationId: NetworkUpdateParams
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            description: MsgUpdateParamsResponse is the Msg/UpdateParams response type.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              authority:
                type: string
                description: >-
                  authority is the address that controls the module (defaults to
                  x/gov).
              params:
                description: >-
                  params defines the module parameters to update. All parameters
                  must be

                  supplied.
                type: object
                properties:
                  activation_limit_multiplier:
                    type: string
                    format: uint64
                    description: >-
                      activation_limit_multiplier scales a node type's active
                      license count into

                      that node type's activation limit.
                  spam_limit_multiplier:
                    type: string
                    format: uint64
                    description: >-
                      spam_limit_multiplier scales a node type's active license
                      count into the

                      recent-activity ceiling that hard-stops activation bursts.
                  max_activation_keys:
                    type: string
                    format: uint64
                    description: >-
                      max_activation_keys is the maximum number of active
                      activation keys per

                      operator.
                  recent_key_limit:
                    type: string
                    format: uint64
                    description: >-
                      recent_key_limit is the maximum number of activation keys
                      an operator may

                      create within recent_key_window.
                  recent_key_window:
                    type: string
                    description: >-
                      recent_key_window is the sliding window for
                      recent_key_limit.
                  status_daily_limit:
                    type: string
                    format: uint64
                    description: >-
                      status_daily_limit is the maximum number of
                      MsgUpdateNodeStatus per node

                      per UTC day.
                  deauthorize_fee:
                    type: array
                    items:
                      type: object
                      properties:
                        denom:
                          type: string
                        amount:
                          type: string
                      description: >-
                        Coin defines a token with a denomination and an amount.


                        NOTE: The amount field is an Int which implements the
                        custom method

                        signatures required by gogoproto.
                    description: >-
                      deauthorize_fee is charged by the
                      MsgDeauthorizeActivationKey handler as

                      a bank transfer to the fee collector, on top of regular
                      gas. Empty

                      disables the charge; chains that want it seed a
                      denominated value.
                  max_gasless_gas:
                    type: string
                    format: uint64
                    description: >-
                      max_gasless_gas caps the declared gas wanted of a gasless
                      transaction.
                  max_gasless_msgs:
                    type: string
                    format: uint64
                    description: >-
                      max_gasless_msgs caps the number of messages in a gasless
                      transaction.
                  max_gasless_tx_bytes:
                    type: string
                    format: uint64
                    description: >-
                      max_gasless_tx_bytes caps the encoded size of a gasless
                      transaction.
            description: MsgUpdateParams is the Msg/UpdateParams request type.
      tags:
        - Msg
