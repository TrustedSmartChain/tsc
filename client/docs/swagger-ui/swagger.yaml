        type: string
        description: activated_by is the activation key address that activated this node.
      type:
        type: string
        description: >-
          type is the node type identifier (e.g. a chain-specific node class).
          It

          must name a registered NodeType at activation; type-conditional
          business

          rules live in consuming modules.
      status:
        description: status is the node lifecycle state.
        type: string
        enum:
          - NODE_STATUS_UNSPECIFIED
          - NODE_STATUS_ACTIVE
          - NODE_STATUS_DEACTIVATED
        default: NODE_STATUS_UNSPECIFIED
      last_active_time:
        type: string
        format: date-time
        description: >-
          last_active_time is the block time of the node's most recent counted

          activity (activation, status update, or attestation). It determines
          the

          node's bucket in the recent-activity index; deactivation does not
