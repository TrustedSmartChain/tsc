  /webstack/license/license/{type_id}/{id}:
    get:
      summary: License queries a license by type id and license id.
      operationId: License
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              license:
                type: object
                properties:
                  id:
                    type: string
                    format: uint64
                    description: >-
                      id is the auto-incremented identifier, unique within the
                      license type.
                  type:
                    type: string
                    description: type is the LicenseType.id this license was issued from.
                  holder:
                    type: string
                    description: holder is the address that owns this license.
                  start_date:
                    type: string
                    description: start_date is the date from which the license is valid.
                  end_date:
                    type: string
                    description: >-
                      end_date is the expiry date as issued. Empty string means
                      no expiry.

                      Revocation does not modify this field.
                  status:
                    description: status is the license lifecycle state.
                    type: string
                    enum:
                      - LICENSE_STATUS_UNSPECIFIED
                      - LICENSE_STATUS_ACTIVE
                      - LICENSE_STATUS_REVOKED
                    default: LICENSE_STATUS_UNSPECIFIED
                  revoked_date:
                    type: string
                    description: >-
                      revoked_date is the date the license was revoked (block
                      date).

                      Empty unless status is LICENSE_STATUS_REVOKED.
                description: License represents an issued license instance.
            description: >-
              QueryLicenseResponse is the response type for the Query/License
              RPC method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
