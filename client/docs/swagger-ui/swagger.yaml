        - Msg
  /nodelabs/network/tx/deauthorize_activation_key:
    post:
      summary: |-
        DeauthorizeActivationKey disables an activation key. Regular gas tx; the
        handler additionally charges the deauthorize_fee param to the operator.
      operationId: DeauthorizeActivationKey
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            description: >-
              MsgDeauthorizeActivationKeyResponse is the
              Msg/DeauthorizeActivationKey response type.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              operator:
                type: string
                description: operator is the signing operator wallet that owns the key.
              activation_address:
                type: string
                description: activation_address is the activation key address to disable.
            description: >-
              MsgDeauthorizeActivationKey is the Msg/DeauthorizeActivationKey
              request type.
      tags:
        - Msg
  /nodelabs/network/tx/update_node_status:
    post:
      summary: |-
        UpdateNodeStatus records a node's periodic status heartbeat. Gasless,
        limited to status_daily_limit per node per UTC day. The payload is
        emitted as an event and not stored in state.
      operationId: UpdateNodeStatus
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            description: >-
              MsgUpdateNodeStatusResponse is the Msg/UpdateNodeStatus response
              type.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: body
          in: body
          required: true
          schema:
            type: object
            properties:
              node_address:
                type: string
                description: node_address is the signing node; it must be active.
              payload:
                description: payload is the self-reported status, emitted as an event.
                type: object
                properties:
                  device:
                    type: string
                    description: device describes the device/hardware.
                  os:
                    type: string
                    description: os describes the operating system and version.
                  hostname:
                    type: string
                    description: hostname is the node's self-reported hostname.
                  node_info:
                    type: string
                    description: node_info describes the node software and version.
                  workloads:
                    type: array
                    items:
                      type: string
                    description: workloads lists the workloads the node is running.
                  memory:
                    type: string
                    description: memory describes memory capacity/usage.
                  cpu:
                    type: string
                    description: cpu describes CPU capacity/usage.
                  storage:
                    type: string
                    description: storage describes storage capacity/usage.
