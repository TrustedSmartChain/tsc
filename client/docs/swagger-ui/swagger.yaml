  /nodelabs/permission/module/{module}:
    get:
      summary: >-
        Module queries a registered module's namespace owner and the permission

        vocabulary the module registered in this binary. The owner is empty if
        it

        has not been set yet.
      operationId: Module
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              namespace:
                type: object
                properties:
                  module:
                    type: string
