        - name: type_id
          in: path
          required: true
          type: string
        - name: id
          in: path
          required: true
          type: string
          format: uint64
      tags:
        - Query
  /webstack/license/license_type/{id}:
    get:
      summary: LicenseType queries a license type by id.
      operationId: LicenseType
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              license_type:
                type: object
                properties:
                  id:
                    type: string
                    description: id is the owner-supplied identifier, e.g. "webstack.node".
                  transferrable:
                    type: boolean
                    description: >-
                      transferrable indicates whether holders may transfer this
                      license type.
                  max_supply:
                    type: string
                    description: >-
                      max_supply is the maximum number of licenses that can be
                      issued. 0 = unlimited.
                  issued_count:
                    type: string
                    description: >-
                      issued_count tracks the total number of licenses issued
                      (used for ID generation).
                  active_count:
                    type: string
                    description: >-
                      active_count tracks the number of currently active
                      licenses.
                  revoked_count:
                    type: string
                    description: revoked_count tracks the number of revoked licenses.
                description: LicenseType defines a template for issuing licenses.
