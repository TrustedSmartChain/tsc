  /nodelabs/network/node_counts/{operator}:
    get:
      summary: |-
        NodeCounts queries an operator's node tallies and current limits, so a
        hosting provider can pre-check whether an activation would be admitted.
      operationId: NodeCounts
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              counts:
                type: array
                items:
                  type: object
                  properties:
                    node_type:
                      type: string
                      description: node_type is the node type these numbers describe.
                    license_type_id:
                      type: string
                      description: license_type_id is the license type backing node_type.
                    total:
                      type: string
                      format: uint64
                      description: >-
                        total is the number of nodes of this type ever activated
                        by the operator.
                    active:
                      type: string
                      format: uint64
                      description: >-
                        active is the number of the operator's currently active
                        nodes of this type.
                    recent_active:
                      type: string
                      format: uint64
                      description: >-
                        recent_active is the number of this type's nodes with
                        counted activity

                        today or yesterday (UTC).
                    license_count:
                      type: string
                      format: uint64
                      description: >-
                        license_count is the operator's active licenses of
                        license_type_id.
                    activation_limit:
                      type: string
                      format: uint64
                      description: >-
                        activation_limit is activation_limit_multiplier x
                        license_count.
                    spam_limit:
                      type: string
                      format: uint64
                      description: spam_limit is spam_limit_multiplier x license_count.
                  description: >-
                    NodeTypeCounts is an operator's tallies and limits for a
                    single node type.

                    Limits are computed from the operator's active licenses of
                    the license type

                    bound to this node type, so they change when those licenses
                    are issued or

                    revoked — and licenses of any other type do not affect them.
                description: counts holds one entry per node type, in node type id order.
            description: >-
              QueryNodeCountsResponse is the response type for the
              Query/NodeCounts RPC

              method. Entitlement is per node type, so the answer is a breakdown
              rather

              than a single tally.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
