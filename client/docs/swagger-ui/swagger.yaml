    type: object
    properties:
      id:
        type: string
        format: uint64
        description: |-
          id is the auto-incremented identifier, unique chain-wide across all
          license types. A bare id is a complete handle to a license.
      type:
        type: string
        description: type is the LicenseType.id this license was issued from.
      holder:
        type: string
        description: holder is the address that owns this license.
      start_date:
        type: string
        description: start_date is the date from which the license is valid.
      end_date:
        type: string
        description: |-
          end_date is the expiry date as issued. Empty string means no expiry.
          Revocation does not modify this field.
      status:
        description: status is the license lifecycle state.
        type: string
        enum:
          - LICENSE_STATUS_UNSPECIFIED
          - LICENSE_STATUS_ACTIVE
          - LICENSE_STATUS_REVOKED
        default: LICENSE_STATUS_UNSPECIFIED
      revoked_date:
        type: string
        description: |-
          revoked_date is the date the license was revoked (block date).
          Empty unless status is LICENSE_STATUS_REVOKED.
    description: License represents an issued license instance.
  license.v1.LicenseStatus:
    type: string
    enum:
      - LICENSE_STATUS_UNSPECIFIED
      - LICENSE_STATUS_ACTIVE
      - LICENSE_STATUS_REVOKED
    default: LICENSE_STATUS_UNSPECIFIED
    description: |-
      LicenseStatus enumerates the lifecycle states of a license.

       - LICENSE_STATUS_UNSPECIFIED: LICENSE_STATUS_UNSPECIFIED is the zero value and never valid in state.
       - LICENSE_STATUS_ACTIVE: LICENSE_STATUS_ACTIVE marks a license that is currently valid.
       - LICENSE_STATUS_REVOKED: LICENSE_STATUS_REVOKED marks a license that has been revoked.
  license.v1.LicenseType:
    type: object
    properties:
      id:
        type: string
        description: id is the owner-supplied identifier, e.g. "nodelabs.node".
      transferrable:
        type: boolean
        description: >-
          transferrable indicates whether holders may transfer this license
          type.
      max_supply:
        type: string
        description: >-
          max_supply is the maximum number of licenses outstanding at once,
          checked

          against active_count. Revoking frees a slot, so lifetime issued_count
          may

          exceed it. 0 = unlimited.
      issued_count:
        type: string
        description: >-
          issued_count tracks the total number of licenses issued (used for ID
          generation).
      active_count:
        type: string
        description: active_count tracks the number of currently active licenses.
      revoked_count:
        type: string
        description: revoked_count tracks the number of revoked licenses.
    description: LicenseType defines a template for issuing licenses.
