syntax = "proto3";
package attestation.v1;

import "attestation/v1/attestation.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/TrustedSmartChain/tsc/v3/x/attestation/types";

// AttestationCounter pairs a node address with one of its daily attestation
// counters for genesis import/export.
message AttestationCounter {
  // node_address is the node the counter belongs to.
  string node_address = 1;
  // counter is the node's rolling daily counter.
  ActivityCounter counter = 2 [(gogoproto.nullable) = false];
}

// GenesisState defines the attestation module genesis state. Attestation
// payloads are never stored in state; only the daily counters carry over.
message GenesisState {
  // Params defines all the parameters of the module.
  Params params = 1 [(gogoproto.nullable) = false];
  // rwa_counters are the per-node daily RWA attestation counters.
  repeated AttestationCounter rwa_counters = 2 [(gogoproto.nullable) = false];
  // rwu_counters are the per-node daily RWU attestation counters.
  repeated AttestationCounter rwu_counters = 3 [(gogoproto.nullable) = false];
}
