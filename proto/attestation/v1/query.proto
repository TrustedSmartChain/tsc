syntax = "proto3";
package attestation.v1;

import "attestation/v1/attestation.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "github.com/TrustedSmartChain/tsc/v4/x/attestation/types";

// Query provides defines the gRPC querier service.
service Query {
  // Params queries all parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/tsc/attestation/v1/params";
  }

  // NodeStats queries when one node last sent an RWA and an RWU attestation.
  // Nodes that have never attested return unset times.
  rpc NodeStats(QueryNodeStatsRequest) returns (QueryNodeStatsResponse) {
    option (google.api.http).get = "/tsc/attestation/v1/node_stats/{node_address}";
  }

  // AllNodeStats queries when every node that has attested last sent an RWA
  // and an RWU attestation, ordered by node address. Pagination is optional.
  rpc AllNodeStats(QueryAllNodeStatsRequest) returns (QueryAllNodeStatsResponse) {
    option (google.api.http).get = "/tsc/attestation/v1/node_stats";
  }
}

// QueryParamsRequest is the request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params defines the parameters of the module.
  Params params = 1 [(gogoproto.nullable) = false];
}

// QueryNodeStatsRequest is the request type for the Query/NodeStats RPC method.
message QueryNodeStatsRequest {
  // node_address is the node to query.
  string node_address = 1;
}

// QueryNodeStatsResponse is the response type for the Query/NodeStats RPC
// method.
message QueryNodeStatsResponse {
  // stats are the node's last attestation times.
  AttestationStats stats = 1 [(gogoproto.nullable) = false];
}

// QueryAllNodeStatsRequest is the request type for the Query/AllNodeStats RPC
// method.
message QueryAllNodeStatsRequest {
  // pagination is optional; omitted, the default page size applies and
  // pagination.next_key in the response points at the next page.
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllNodeStatsResponse is the response type for the Query/AllNodeStats
// RPC method.
message QueryAllNodeStatsResponse {
  // stats are the nodes' last attestation times.
  repeated AttestationStats stats = 1 [(gogoproto.nullable) = false];
  // pagination defines the pagination in the response.
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
