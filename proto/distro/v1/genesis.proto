syntax = "proto3";
package distro.v1;

import "gogoproto/gogo.proto";
import "amino/amino.proto";

option go_package = "github.com/TrustedSmartChain/tsc/v4/x/distro/types";

// GenesisState defines the module genesis state
message GenesisState {
  // Params defines all the parameters of the module.
  Params params = 1 [(gogoproto.nullable) = false];
}

// Params defines the set of module parameters.
message Params {
  option (amino.name) = "tsc/x/distro/params";
  option (gogoproto.equal) = true;

  string minting_address = 1;
  string receiving_address = 2;
  string denom = 3;
  // max_supply (field 4) was removed in v4.2: the supply cap is the fixed
  // 21,000,000 TSC of the whitepaper, compiled in as types.MaxSupply rather
  // than a governance-changeable param. Never reuse field 4 or the name.
  reserved 4;
  reserved "max_supply";
  string distribution_start_date = 5;
  uint64 months_in_halving_period = 6;
}