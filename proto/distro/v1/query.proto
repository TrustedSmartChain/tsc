syntax = "proto3";
package distro.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "distro/v1/genesis.proto";
import "distro/v1/state.proto";

option go_package = "github.com/TrustedSmartChain/tsc/v3/x/distro/types";

// Query provides defines the gRPC querier service.
service Query {
  // Params queries all parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/tsc/distro/v1/params";
  }
  // Distribution queries the canonical distribution for a day (YYYY-MM-DD).
  rpc Distribution(QueryDistributionRequest) returns (QueryDistributionResponse) {
    option (google.api.http).get = "/tsc/distro/v1/distribution/{date}";
  }
  // DistributionVotes queries all submitted votes for a day (YYYY-MM-DD).
  rpc DistributionVotes(QueryDistributionVotesRequest) returns (QueryDistributionVotesResponse) {
    option (google.api.http).get = "/tsc/distro/v1/distribution_votes/{date}";
  }
  // Claimed reports whether a (date, nonce) reward has been claimed.
  rpc Claimed(QueryClaimedRequest) returns (QueryClaimedResponse) {
    option (google.api.http).get = "/tsc/distro/v1/claimed/{date}/{nonce}";
  }
  // ClaimsByDate lists the reward nonces claimed for a day (YYYY-MM-DD).
  rpc ClaimsByDate(QueryClaimsByDateRequest) returns (QueryClaimsByDateResponse) {
    option (google.api.http).get = "/tsc/distro/v1/claims/{date}";
  }
  // ClaimTotalByCategory reports the cumulative claimed amount per category for a
  // day's distribution (YYYY-MM-DD).
  rpc ClaimTotalByCategory(QueryClaimTotalByCategoryRequest) returns (QueryClaimTotalByCategoryResponse) {
    option (google.api.http).get = "/tsc/distro/v1/claim_total_by_category/{date}";
  }
  // Audit runs the module's invariants (claim budget, bond solvency) against the
  // current state and reports the result. Lets operators verify module health on
  // a live node, since no crisis module is wired for runtime invariant checks.
  rpc Audit(QueryAuditRequest) returns (QueryAuditResponse) {
    option (google.api.http).get = "/tsc/distro/v1/audit";
  }
}

// QueryParamsRequest is the request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is the response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params defines the parameters of the module.
  Params params = 1;
}

message QueryDistributionRequest {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
}

message QueryDistributionResponse {
  Distribution distribution = 1;
}

message QueryDistributionVotesRequest {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
}

message QueryDistributionVotesResponse {
  repeated DistributionVote votes = 1 [(gogoproto.nullable) = false];
}

message QueryClaimedRequest {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
  uint64 nonce = 2;
}

message QueryClaimedResponse {
  bool claimed = 1;
}

message QueryClaimsByDateRequest {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
}

message QueryClaimsByDateResponse {
  // nonces are the claimed reward nonces for the day, in ascending order.
  repeated uint64 nonces = 1;
}

message QueryClaimTotalByCategoryRequest {
  // date selects the distribution by calendar day (YYYY-MM-DD).
  string date = 1;
}

message QueryClaimTotalByCategoryResponse {
  // date is the distribution day the totals belong to.
  string date = 1;
  // totals maps each reward category to its cumulative claimed amount.
  map<string, string> totals = 2;
}

message QueryAuditRequest {}

// AuditResult is the outcome of a single module invariant check.
message AuditResult {
  // name identifies the invariant (e.g. "claim-budget", "bond-solvency").
  string name = 1;
  // broken is true when the invariant does not hold for the current state.
  bool broken = 2;
  // message is a human-readable description of the result.
  string message = 3;
}

message QueryAuditResponse {
  // broken is true if any invariant is broken.
  bool broken = 1;
  // results holds the outcome of each invariant check.
  repeated AuditResult results = 2 [(gogoproto.nullable) = false];
}
