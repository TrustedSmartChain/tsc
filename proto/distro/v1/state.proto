syntax = "proto3";
package distro.v1;

import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/TrustedSmartChain/tsc/v3/x/distro/types";

// DistributionStatus is the lifecycle state of a day's distribution.
//
// VOTING -> PENDING -> LIVE is the happy path. A licensed holder may challenge a
// PENDING distribution within the review-delay window, moving it to
// UNDER_REVIEW, which reopens voting; the re-tally resolves the challenge.
enum DistributionStatus {
  option (gogoproto.goproto_enum_prefix) = false;

  // DISTRIBUTION_STATUS_VOTING means votes are accumulating; no consensus yet.
  DISTRIBUTION_STATUS_VOTING = 0;
  // DISTRIBUTION_STATUS_LIVE means the canonical root is claimable.
  DISTRIBUTION_STATUS_LIVE = 1;
  // DISTRIBUTION_STATUS_PENDING means consensus was reached and the distribution
  // is in the review-delay window, auto-promoting to LIVE if unchallenged.
  DISTRIBUTION_STATUS_PENDING = 2;
  // DISTRIBUTION_STATUS_UNDER_REVIEW means a licensed holder challenged the
  // pending root; voting has reopened and the re-tally will resolve it.
  DISTRIBUTION_STATUS_UNDER_REVIEW = 3;
  // DISTRIBUTION_STATUS_EXPIRED means the day never reached consensus within
  // the voting window; it is no longer tallied.
  DISTRIBUTION_STATUS_EXPIRED = 4;
}

// DistributionHeader is the header leaf committed in a submitted merkle tree: it
// records the distribution's version and the authoritative per-category totals.
// The totals are validated against the params percentages at submission time.
message DistributionHeader {
  uint64 version = 1;
  // totals_by_category maps each reward category to the total it distributes.
  map<string, string> totals_by_category = 2;
}

// DistributionVote is a single node's submitted merkle root for a (day, type).
// Stored (and retained) keyed by (date, distro_type, signer).
message DistributionVote {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
  string signer = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes merkle_root = 3;
  // distro_type is the distribution type id this vote is for.
  string distro_type = 4;
  // header is the header leaf (version + totals) committed in merkle_root.
  DistributionHeader header = 5;
}

// Distribution is the canonical/finalized result for a single (day, type),
// identified by (date YYYY-MM-DD, distro_type).
message Distribution {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
  bytes merkle_root = 2;
  DistributionStatus status = 3;
  // license_tally / stake_tally / validator_tally record the winning root's
  // fractions for each configured consensus mechanism at finalization. A
  // mechanism not configured for the type is left empty.
  string license_tally = 4;
  string stake_tally = 5;
  string validator_tally = 14;
  // finalized_height is the block height at which the distribution went LIVE.
  int64 finalized_height = 6;
  // pending_since_date is the date (YYYY-MM-DD) at which this distribution
  // entered PENDING; used to measure the review-delay window.
  string pending_since_date = 7;
  // challenger is the address that placed this distribution UNDER_REVIEW (empty
  // otherwise). Set while UNDER_REVIEW so the bond can be refunded or burned.
  string challenger = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // challenge_bond is the amount (in the module denom) escrowed by the
  // challenger while UNDER_REVIEW.
  string challenge_bond = 9;
  // claimed_amount is the cumulative amount (in the module denom) already
  // claimed for this day, capped by the day's halving budget.
  string claimed_amount = 10;
  // voting_since_date is the date (YYYY-MM-DD) at which this distribution last
  // (re)opened for VOTING. The voting window is measured from this date, so a
  // governance-revived day gets a fresh full window rather than being measured
  // from its (now stale) calendar date.
  string voting_since_date = 11;
  // distro_type is the distribution type id this record is for.
  string distro_type = 12;
  // header is the header leaf (version + totals) of the canonical (winning) root,
  // captured when the day reaches consensus.
  DistributionHeader header = 13;
}

// ClaimedReward is the genesis representation of the claimed nonces for a
// (day, type).
message ClaimedReward {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
  repeated uint64 nonces = 2;
  // distro_type is the distribution type id these nonces belong to.
  string distro_type = 3;
}

// CategoryClaimTotal is the cumulative amount (in the module denom) claimed for
// a single reward category within a day's distribution. Totals accumulate as
// rewards are claimed and are queryable via Query/ClaimTotalByCategory.
message CategoryClaimTotal {
  // date is the distribution day in YYYY-MM-DD form.
  string date = 1;
  string category = 2;
  string total = 3;
  // distro_type is the distribution type id this total belongs to.
  string distro_type = 4;
}
