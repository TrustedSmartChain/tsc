syntax = "proto3";
package distro.v1;

import "cosmos/msg/v1/msg.proto";
import "distro/v1/genesis.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "google/api/annotations.proto";

option go_package = "github.com/TrustedSmartChain/tsc/v3/x/distro/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a governance operation for updating the parameters.
  //
  // Since: cosmos-sdk 0.47
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse) {
    option (google.api.http).post = "/tsc/distro/v1/tx/update_params";
  }
  // SubmitDistributionRoot records a node's merkle root for a day.
  rpc SubmitDistributionRoot(MsgSubmitDistributionRoot) returns (MsgSubmitDistributionRootResponse) {
    option (google.api.http).post = "/tsc/distro/v1/tx/submit_distribution_root";
  }
  // Claim claims a reward from a finalized (live) day via a merkle proof.
  rpc Claim(MsgClaim) returns (MsgClaimResponse) {
    option (google.api.http).post = "/tsc/distro/v1/tx/claim";
  }
  // ChallengeDistribution places a PENDING day's distribution UNDER_REVIEW,
  // reopening voting. The challenger must hold an active license and escrows a
  // bond that is refunded if the re-vote changes the root, or burned otherwise.
  rpc ChallengeDistribution(MsgChallengeDistribution) returns (MsgChallengeDistributionResponse) {
    option (google.api.http).post = "/tsc/distro/v1/tx/challenge_distribution";
  }
  // ReviveDistribution reopens an EXPIRED day for voting with a fresh window.
  // Governance-gated, since it un-forfeits a day's rewards.
  rpc ReviveDistribution(MsgReviveDistribution) returns (MsgReviveDistributionResponse) {
    option (google.api.http).post = "/tsc/distro/v1/tx/revive_distribution";
  }
}

// MsgUpdateParams is the Msg/UpdateParams request type.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address of the governance account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParamsResponse {}

// MsgSubmitDistributionRoot submits the merkle root of a node's deterministic
// daily distribution calculation for a given day. The signer must hold >= 1
// active license of the configured distribution license type.
message MsgSubmitDistributionRoot {
  option (cosmos.msg.v1.signer) = "signer";

  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // date is the distribution day in YYYY-MM-DD form.
  string date = 2;
  bytes merkle_root = 3;
  // distro_type is the distribution type id this submission is for.
  string distro_type = 4;
  // version is the header leaf's version.
  uint64 version = 5;
  // totals_by_category is the header leaf's authoritative per-category totals.
  // Validated against the params percentages for the type.
  map<string, string> totals_by_category = 6;
  // header_proof proves the header leaf (distro_type, date, version,
  // totals_by_category) is included in merkle_root.
  repeated bytes header_proof = 7;
}

message MsgSubmitDistributionRootResponse {}

// MsgClaim claims a reward from a finalized (live) day's distribution. The leaf
// is reconstructed from (nonce, address, total, categories) and verified against
// the canonical root via the supplied merkle proof.
message MsgClaim {
  option (cosmos.msg.v1.signer) = "claimer";

  string claimer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // date is the distribution day in YYYY-MM-DD form.
  string date = 2;
  uint64 nonce = 3;
  // distro_type is the distribution type id being claimed against.
  string distro_type = 8;
  string address = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // total is the full reward amount for this leaf. It must equal the sum of the
  // category amounts.
  string total = 5;
  // categories breaks the total down by reward category (e.g. "type1"). The
  // merkle leaf commits to this map, so the breakdown cannot be tampered with.
  map<string, string> categories = 6;
  repeated bytes proof = 7;
}

message MsgClaimResponse {}

// MsgChallengeDistribution challenges a PENDING day's distribution, moving it
// UNDER_REVIEW and reopening voting. The signer must hold an active license of
// the configured type.
message MsgChallengeDistribution {
  option (cosmos.msg.v1.signer) = "challenger";

  string challenger = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // date is the distribution day in YYYY-MM-DD form.
  string date = 2;
  // distro_type is the distribution type id being challenged.
  string distro_type = 3;
}

message MsgChallengeDistributionResponse {}

// MsgReviveDistribution reopens an EXPIRED day's distribution for voting,
// resetting the voting window to a fresh full VoteWindowDays measured from the
// current day. Governance-gated: the authority must be the module's governance
// account, because reviving un-forfeits a day whose rewards had lapsed.
message MsgReviveDistribution {
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address of the governance account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // date is the distribution day in YYYY-MM-DD form.
  string date = 2;
  // distro_type is the distribution type id being revived.
  string distro_type = 3;
}

message MsgReviveDistributionResponse {}
